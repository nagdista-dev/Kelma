<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#0d9488" stop-opacity="0.25"/>
      <stop offset="0.55" stop-color="#0d9488" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- Letter tile K -->
  <rect x="148" y="128" width="66" height="256" rx="18" fill="url(#teal)"/>
  <line x1="238" y1="150" x2="368" y2="256" stroke="url(#teal)" stroke-width="62" stroke-linecap="round"/>
  <line x1="244" y1="256" x2="368" y2="362" stroke="url(#teal)" stroke-width="62" stroke-linecap="round"/>

  <!-- Cairo gold accent dot -->
